name: Tests PHPUnit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Test sur plusieurs versions de PHP (ajustez selon vos prérequis)
        php-version: [ '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration de PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2

      - name: Validation du fichier composer.json
        run: composer validate --strict

      - name: Récupération du cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Installation des dépendances
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Exécution des tests PHPUnit avec couverture de code
        run: vendor/bin/phpunit tests --coverage-text

  phpstan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: pcov
          tools: composer:v2

      - name: Validation du fichier composer.json
        run: composer validate --strict

      - name: Récupération du cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-
            
      - name: Installation des dépendances
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Exécution analyze static
        run: vendor/bin/phpstan analyse -c phpstan.neon

  php-cs-fixer:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Configuration de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: pcov
          tools: composer:v2

      - name: Validation du fichier composer.json
        run: composer validate --strict

      - name: Récupération du cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-

      - name: Installation des dépendances
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Exécution analyze static
        run: vendor/bin/php-cs-fixer check --diff